name: Build Tauri Wrapper

on:
    push:
    pull_request:
        paths:
            - 'src-tauri/**'
            - '.github/workflows/tauri-wrapper-build.yml'
    workflow_dispatch:

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      artifact_path: src-tauri/target/x86_64-unknown-linux-gnu/release/monochrome-tauri
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      artifact_path: src-tauri/target/x86_64-pc-windows-msvc/release/monochrome-tauri.exe
                    - os: macos-latest
                      target: x86_64-apple-darwin
                      artifact_path: src-tauri/target/x86_64-apple-darwin/release/monochrome-tauri

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Linux system dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libgtk-3-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    libsoup-3.0-dev \
                    patchelf

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Run tests
              if: runner.os == 'Linux'
              run: cargo test --manifest-path src-tauri/Cargo.toml

            - name: Run JS shim tests
              if: runner.os == 'Linux'
              run: node src-tauri/tests/fetch_shim_test.cjs

            - name: Build release binary
              run: cargo build --manifest-path src-tauri/Cargo.toml --release --target ${{ matrix.target }}

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: monochrome-tauri-${{ matrix.target }}
                  path: ${{ matrix.artifact_path }}
                  if-no-files-found: error
